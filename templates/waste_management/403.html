{% extends 'base.html' %}

{% block title %}Access Denied (403) - Smart Waste Management{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 580px; margin: 60px auto; padding: 48px 30px;">
  <div class="empty-state-icon" style="background: #fee2e2; color: #dc2626;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
  </div>
  <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 8px;">403 - Access Restricted</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">
    You do not possess the required municipal staff privileges to view this section or record.
  </p>
  <div style="display: flex; gap: 12px; justify-content: center;">
    <a href="{% url 'citizen_dashboard' %}" class="btn btn-primary">Go to Citizen Dashboard</a>
    <a href="{% url 'landing' %}" class="btn btn-outline">Home</a>
  </div>
</div>
{% endblock %}
