{% extends 'base.html' %}

{% block title %}Page Not Found (404) - Smart Waste Management{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 580px; margin: 60px auto; padding: 48px 30px;">
  <div class="empty-state-icon" style="background: #fee2e2; color: #dc2626;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
  </div>
  <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 8px;">404 - Page Not Found</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">
    The complaint ID, pickup record, or URL you were looking for does not exist or may have been relocated.
  </p>
  <div style="display: flex; gap: 12px; justify-content: center;">
    <a href="{% url 'landing' %}" class="btn btn-primary">Return to Homepage</a>
    <a href="{% url 'citizen_dashboard' %}" class="btn btn-outline">My Dashboard</a>
  </div>
</div>
{% endblock %}
