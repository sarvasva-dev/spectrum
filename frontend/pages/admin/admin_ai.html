{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipal Control AI Assistant — CleanLoop</title>
    <meta name="description" content="CleanLoop Municipal Control AI for real-time dispatch, city analytics, and crew scheduling.">
    <link rel="icon" type="image/svg+xml" href="{% static 'images/cleanloop-mark.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-dark: #1e3a8a;
            --accent: #0284c7;
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --border-soft: #e2e8f0;
            --ok: #059669;
            --ok-bg: #d1fae5;
            --warn: #d97706;
            --warn-bg: #fef3c7;
            --err: #dc2626;
            --err-bg: #fee2e2;
            --radius: 14px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ai-app {
            width: 100%;
            max-width: 960px;
            height: 100vh;
            max-height: 900px;
            background: var(--bg-body);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Header */
        .ai-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            border-bottom: 1px solid #334155;
            position: relative;
            z-index: 10;
        }
        .ai-brand-logo { border-radius: 10px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .ai-title-block { flex: 1; min-width: 0; }
        .ai-title { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
        .ai-subtitle { font-size: 0.76rem; color: #94a3b8; font-weight: 500; }
        .ai-status {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
            padding: 4px 10px; border-radius: 999px; white-space: nowrap;
        }
        .ai-status .dot { width: 8px; height: 8px; border-radius: 50%; }
        .ai-status.ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .ai-status.ok .dot { background: #34d399; }
        .ai-status.limited { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .ai-status.limited .dot { background: #fbbf24; }
        .header-link {
            font-size: 0.8rem; color: #93c5fd; text-decoration: none;
            font-weight: 600; padding: 6px 10px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.08); transition: all 0.15s;
        }
        .header-link:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        /* Chat window */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .msg { max-width: 86%; padding: 12px 16px; border-radius: var(--radius); font-size: 0.94rem; box-shadow: var(--shadow-sm); word-wrap: break-word; line-height: 1.5; }
        .msg.ai {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-bottom-left-radius: 4px;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.ai b { color: #1e3a8a; }
        .msg-time { display: block; font-size: 0.66rem; opacity: 0.55; margin-top: 5px; }

        /* Action chips */
        .actions-wrap { display: flex; flex-direction: column; gap: 8px; align-self: stretch; margin-top: 4px; }
        .actions-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .action-chip {
            background: var(--surface);
            border: 1.5px solid var(--primary);
            color: var(--primary-dark);
            padding: 9px 15px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.15s ease;
            min-height: 40px;
        }
        .action-chip:hover { background: var(--primary); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30, 64, 175, 0.25); }
        .action-chip.danger { border-color: var(--err); color: var(--err); }
        .action-chip.danger:hover { background: var(--err); color: #fff; }

        /* Cards */
        .card {
            align-self: stretch;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 14px 16px;
            font-size: 0.9rem;
        }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .card-title { font-weight: 700; font-size: 0.98rem; color: #0f172a; }
        .card-id {
            font-family: monospace; font-size: 0.82rem; font-weight: 700;
            color: var(--primary-dark); background: var(--primary-light);
            padding: 3px 8px; border-radius: 6px;
        }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        .stat-box { background: #f8fafc; border: 1px solid var(--border-soft); padding: 10px 12px; border-radius: 10px; }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: #0f172a; margin-top: 2px; }

        /* Composer */
        .composer {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid var(--border-soft);
            background: var(--surface);
        }
        #chat-input {
            flex: 1; padding: 12px 18px; border: 1.5px solid var(--border);
            border-radius: 999px; font-size: 0.95rem; outline: none;
            background: var(--bg-body); transition: border-color 0.15s;
        }
        #chat-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.12); }
        .send-btn {
            width: 46px; height: 46px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(30, 64, 175, 0.35); transition: transform 0.12s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn svg { width: 20px; height: 20px; }

        @media (max-width: 640px) {
            .ai-app { border-radius: 0; max-height: 100vh; }
            .msg { max-width: 92%; }
        }
    </style>
</head>
<body>
    <div class="ai-app">
        <!-- Header -->
        <header class="ai-header">
            <a class="header-link" href="{% url 'admin_dashboard' %}">←<span> Control Dashboard</span></a>
            <img class="ai-brand-logo" src="{% static 'images/cleanloop-mark.svg' %}" alt="CleanLoop logo" width="38" height="38">
            <div class="ai-title-block">
                <div class="ai-title">CleanLoop Control AI</div>
                <div class="ai-subtitle">Municipal Dispatch & Operations Assistant</div>
            </div>
            <span id="ai-status" class="ai-status limited"><span class="dot"></span><span id="ai-status-text">CHECKING…</span></span>
        </header>

        <!-- Chat -->
        <main id="chat-window" aria-live="polite"></main>

        <!-- Composer -->
        <form class="composer" id="composer" autocomplete="off">
            <input type="text" id="chat-input" placeholder="Type a command or Complaint/Pickup ID…" autocomplete="off">
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send command">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script>
    (function () {
        "use strict";

        var state = { intent: "", step: "START" };
        var busy = false;
        var chatWindow = document.getElementById("chat-window");
        var inputEl = document.getElementById("chat-input");
        var sendBtn = document.getElementById("send-btn");
        var composer = document.getElementById("composer");
        var statusEl = document.getElementById("ai-status");
        var statusText = document.getElementById("ai-status-text");

        function nowTime() {
            var d = new Date();
            return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
        }

        function scrollDown() {
            requestAnimationFrame(function () { chatWindow.scrollTop = chatWindow.scrollHeight; });
        }

        function addMessage(html, who) {
            var div = document.createElement("div");
            div.className = "msg " + who;
            div.innerHTML = html;
            var t = document.createElement("span");
            t.className = "msg-time";
            t.textContent = nowTime();
            div.appendChild(t);
            chatWindow.appendChild(div);
            scrollDown();
            return div;
        }

        function clearOldActions() {
            var olds = chatWindow.querySelectorAll(".actions-wrap");
            olds.forEach(function (el) { el.remove(); });
        }

        function setStatus(available) {
            if (available) {
                statusEl.className = "ai-status ok";
                statusText.textContent = "AI ONLINE";
            } else {
                statusEl.className = "ai-status limited";
                statusText.textContent = "CONTROL MODE";
            }
        }

        function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text;
            return d.innerHTML;
        }

        function addActions(actions) {
            if (!actions || !actions.length) return;
            var wrap = document.createElement("div");
            wrap.className = "actions-wrap";
            var container = document.createElement("div");
            container.className = "actions-container";
            actions.forEach(function (action) {
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "action-chip " + (action.toLowerCase().indexOf("cancel") !== -1 ? "danger" : "");
                btn.textContent = action;
                btn.addEventListener("click", function () {
                    if (busy) return;
                    clearOldActions();
                    sendMessage(action);
                });
                container.appendChild(btn);
            });
            wrap.appendChild(container);
            chatWindow.appendChild(wrap);
            scrollDown();
        }

        function addCard(card) {
            if (!card) return;
            var el = document.createElement("div");
            el.className = "card";

            if (card.kind === "admin_summary") {
                var h = document.createElement("div");
                h.className = "card-title";
                h.textContent = card.title;
                el.appendChild(h);
                var grid = document.createElement("div");
                grid.className = "summary-grid";
                (card.stats || []).forEach(function (pair) {
                    var box = document.createElement("div");
                    box.className = "stat-box";
                    box.innerHTML = '<div class="stat-label">' + escapeHtml(pair[0]) + '</div><div class="stat-val">' + escapeHtml(pair[1]) + '</div>';
                    grid.appendChild(box);
                });
                el.appendChild(grid);
            } else if (card.kind === "complaint" || card.kind === "pickup") {
                el.innerHTML = '<div class="card-head"><span class="card-id">' + escapeHtml(card.id) + '</span><b>' + escapeHtml(card.status) + '</b></div>' +
                    '<div class="card-title">' + escapeHtml(card.title) + '</div>' +
                    '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">📅 ' + escapeHtml(card.date) + (card.location ? ' • 📍 ' + escapeHtml(card.location) : '') + '</div>';
            }

            chatWindow.appendChild(el);
            scrollDown();
        }

        function getCookie(name) {
            var m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
            return m ? m.pop() : "";
        }

        function sendMessage(text) {
            if (busy) return;
            addMessage(escapeHtml(text), "user");
            inputEl.value = "";
            busy = true;
            sendBtn.disabled = true;

            fetch("/api/admin-ai/chat/", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify({ message: text, state: Object.assign({}, state) })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                busy = false;
                sendBtn.disabled = false;
                clearOldActions();
                if (!data.ok) {
                    addMessage("Control AI offline.", "ai");
                    return;
                }
                state = data.state || {};
                state.intent = data.intent;
                state.step = data.step;
                setStatus(data.provider_available !== false);
                addMessage(data.message, "ai");
                (data.cards || []).forEach(addCard);
                addActions(data.actions);
            })
            .catch(function () {
                busy = false;
                sendBtn.disabled = false;
                clearOldActions();
                addMessage("Control AI unavailable.", "ai");
            });
        }

        composer.addEventListener("submit", function (e) {
            e.preventDefault();
            var text = inputEl.value.trim();
            if (!text || busy) return;
            sendMessage(text);
        });

        // Boot
        (function boot() {
            fetch("/api/admin-ai/chat/", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify({ message: "", state: {} })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.ok) {
                    state = data.state || {};
                    setStatus(data.provider_available !== false);
                    addMessage(data.message, "ai");
                    addActions(data.actions);
                }
            });
        })();
    })();
    </script>
</body>
</html>
