{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>CleanLoop AI Assistant | Presentation Demo</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/cleanloop-mark.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #dbeafe;
            --primary-dark: #1e40af;
            --secondary: #0284c7;
            --secondary-light: #e0f2fe;
            --bg-body: #f0f7ff;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
            --border-soft: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.10);
            --ok: #059669;
            --ok-bg: #d1fae5;
            --warn: #b45309;
            --warn-bg: #fef3c7;
            --err: #dc2626;
            --err-bg: #fee2e2;
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, #eaf3ff 0%, var(--bg-body) 40%, #f8fafc 100%);
            color: var(--text-main);
            line-height: 1.5;
        }

        .ai-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 760px;
            margin: 0 auto;
            background: var(--surface);
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.08);
        }

        /* Header */
        .ai-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border-soft);
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 5;
        }
        .ai-brand-logo {
            width: 42px; height: 42px;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(37, 99, 235, 0.25));
        }
        .ai-title-block { flex: 1; min-width: 0; }
        .ai-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; color: var(--primary-dark); }
        .ai-subtitle { font-size: 0.78rem; color: var(--text-muted); }
        .demo-badge {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff; font-size: 0.72rem; font-weight: 800;
            padding: 4px 10px; border-radius: 999px; letter-spacing: 0.08em;
        }

        /* Chat window */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .msg { max-width: 88%; padding: 12px 16px; border-radius: var(--radius); font-size: 0.94rem; box-shadow: var(--shadow-sm); word-wrap: break-word; line-height: 1.5; }
        .msg.ai {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-bottom-left-radius: 4px;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.ai b { color: var(--primary-dark); }
        .msg-time { display: block; font-size: 0.66rem; opacity: 0.55; margin-top: 4px; }

        .timer-box {
            align-self: flex-start;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form simulation card */
        .form-sim-card {
            align-self: stretch;
            background: #f8fafc;
            border: 1.5px solid var(--primary-light);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin: 4px 0;
            box-shadow: var(--shadow-sm);
        }
        .form-sim-title { font-size: 0.9rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .form-sim-field { margin-bottom: 8px; }
        .form-sim-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .form-sim-val { font-size: 0.9rem; font-weight: 600; color: var(--text-main); background: #fff; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-soft); min-height: 32px; }

        /* Action chips */
        .actions-wrap { display: flex; flex-direction: column; gap: 8px; align-self: stretch; margin-top: 4px; }
        .actions-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .action-chip {
            background: var(--surface);
            border: 1.5px solid var(--primary);
            color: var(--primary-dark);
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 700;
            transition: all 0.15s ease;
            min-height: 40px;
        }
        .action-chip:hover { background: var(--primary); color: #fff; transform: translateY(-1px); box-shadow: 0 3px 8px rgba(37, 99, 235, 0.3); }

        /* Cards */
        .card {
            align-self: stretch;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 14px 16px;
            font-size: 0.9rem;
        }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .card-title { font-weight: 700; font-size: 0.98rem; }
        .card-id {
            font-family: monospace; font-size: 0.82rem; font-weight: 800;
            color: var(--primary-dark); background: var(--primary-light);
            padding: 3px 8px; border-radius: 6px;
        }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em; }
        .badge-pending { background: var(--warn-bg); color: var(--warn); }
        .badge-assigned { background: var(--primary-light); color: var(--primary-dark); }
        .badge-inprogress { background: #ede9fe; color: #6d28d9; }
        .badge-resolved { background: var(--ok-bg); color: var(--ok); }
        .badge-requested { background: var(--warn-bg); color: var(--warn); }
        .badge-completed { background: var(--ok-bg); color: var(--ok); }

        .stepper { display: flex; gap: 6px; margin: 12px 0 6px; }
        .stepper .step { flex: 1; text-align: center; font-size: 0.68rem; font-weight: 800; color: var(--text-muted); padding-top: 6px; position: relative; text-transform: uppercase; }
        .stepper .step::before { content: ""; display: block; height: 5px; border-radius: 3px; background: var(--border-soft); margin-bottom: 6px; }
        .stepper .step.done::before, .stepper .step.current::before { background: var(--primary); }
        .stepper .step.done { color: var(--primary-dark); }
        .stepper .step.current { color: var(--primary); }

        .timeline-list { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-soft); font-size: 0.82rem; }
        .timeline-item { margin-bottom: 6px; color: var(--text-main); }
        .timeline-item b { color: var(--primary-dark); }

        /* Composer */
        .composer {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; border-top: 1px solid var(--border-soft); background: var(--surface);
        }
        #chat-input {
            flex: 1; padding: 12px 18px; border: 1.5px solid var(--border);
            border-radius: 999px; font-size: 0.95rem; outline: none; background: var(--bg-body); transition: border-color 0.15s;
        }
        #chat-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .send-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35); transition: transform 0.12s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn svg { width: 20px; height: 20px; }

        @media (max-width: 640px) {
            .ai-app { border-radius: 0; max-height: 100vh; }
            .msg { max-width: 92%; }
        }
    </style>
</head>
<body>
    <div class="ai-app">
        <!-- Header -->
        <header class="ai-header">
            <img class="ai-brand-logo" src="{% static 'images/cleanloop-mark.svg' %}" alt="CleanLoop logo" width="40" height="40">
            <div class="ai-title-block">
                <div class="ai-title">CleanLoop AI</div>
                <div class="ai-subtitle">Spectrum Presentation Citizen Assistant</div>
            </div>
            <span class="demo-badge">PRESENTATION MODE</span>
        </header>

        <!-- Chat window -->
        <main id="chat-window" aria-live="polite"></main>

        <!-- Composer -->
        <form class="composer" id="composer" autocomplete="off">
            <input type="text" id="chat-input" placeholder="Type a message…" autocomplete="off">
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script>
    (function () {
        "use strict";

        var chatWindow = document.getElementById("chat-window");
        var inputEl = document.getElementById("chat-input");
        var sendBtn = document.getElementById("send-btn");
        var composer = document.getElementById("composer");
        var timerBoxEl = null;

        function getCookie(name) {
            var m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
            return m ? m.pop() : "";
        }

        function nowTime() {
            var d = new Date();
            return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
        }

        function scrollDown() {
            requestAnimationFrame(function () { chatWindow.scrollTop = chatWindow.scrollHeight; });
        }

        function addMessage(html, who) {
            var div = document.createElement("div");
            div.className = "msg " + who;
            div.innerHTML = html;
            var t = document.createElement("span");
            t.className = "msg-time";
            t.textContent = nowTime();
            div.appendChild(t);
            chatWindow.appendChild(div);
            scrollDown();
            return div;
        }

        function clearOldActions() {
            var olds = chatWindow.querySelectorAll(".actions-wrap");
            olds.forEach(function (el) { el.remove(); });
        }

        function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text || "";
            return d.innerHTML;
        }

        function badgeClass(st) {
            return "badge badge-" + (st || "").toLowerCase().replace(/\s+/g, "");
        }

        function addActions(actions) {
            if (!actions || !actions.length) return;
            var wrap = document.createElement("div");
            wrap.className = "actions-wrap";
            var container = document.createElement("div");
            container.className = "actions-container";
            actions.forEach(function (act) {
                var btn = document.createElement("button");
                btn.type = "button";
                var label = typeof act === "string" ? act : act.label;
                var cls = typeof act === "object" && act.cls ? act.cls : "";
                btn.className = "action-chip " + cls;
                btn.textContent = label;
                btn.addEventListener("click", function () {
                    clearOldActions();
                    handleAction(label);
                });
                container.appendChild(btn);
            });
            wrap.appendChild(container);
            chatWindow.appendChild(wrap);
            scrollDown();
        }

        function fetchSync(cb) {
            fetch("/api/demo/citizen-sync/", { method: "GET", credentials: "same-origin" })
            .then(function(r) { return r.json(); })
            .then(function(res) { if (cb) cb(res); });
        }

        function boot() {
            addMessage("Welcome to CleanLoop 👋<br>Preparing your citizen service demonstration…", "ai");
            start5SecTimer();
        }

        function showTrackingButtons() {
            addActions([
                { label: "📍 Track Complaint", cls: "" },
                { label: "📦 Track Pickup", cls: "" }
            ]);
        }

        function start5SecTimer() {
            var remaining = 5;
            timerBoxEl = document.createElement("div");
            timerBoxEl.className = "timer-box";
            timerBoxEl.innerHTML = '⏱️ Automatic demonstration starting in <b><span id="cd-val">' + remaining + '</span>s</b>…';
            chatWindow.appendChild(timerBoxEl);
            scrollDown();

            var timer = setInterval(function() {
                remaining--;
                var v = document.getElementById("cd-val");
                if (v) v.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(timer);
                    if (timerBoxEl) timerBoxEl.remove();
                    runScriptedCitizenFlow();
                }
            }, 1000);
        }

        function runScriptedCitizenFlow() {
            addMessage("Welcome to CleanLoop 👋 Let's create your citizen account.", "ai");
            setTimeout(function() {
                renderRegistrationCardSimulation(function() {
                    addMessage("Creating your CleanLoop account in Django database…", "ai");
                    setTimeout(function() {
                        executeCitizenBackendStart(function(res) {
                            addMessage("Hi 👋 Welcome to CleanLoop.<br>I'll walk you through how a citizen can report a waste issue and request a pickup.", "ai");
                            setTimeout(function() {
                                addMessage("What would you like to report? → <b>Garbage on Road</b>", "ai");
                                setTimeout(function() {
                                    addMessage("Please describe what you found: <i>Demonstration complaint created for CleanLoop presentation.</i>", "ai");
                                    setTimeout(function() {
                                        addMessage("Identifying location… <b>Spectrum Demo Location</b> ✓", "ai");
                                        setTimeout(function() {
                                            renderComplaintCard(res.complaint);
                                            setTimeout(function() {
                                                addMessage("Your complaint is submitted. Now let's request a waste pickup.", "ai");
                                                setTimeout(function() {
                                                    addMessage("Waste category: <b>E-Waste</b> • Quantity: <b>2 demo bags</b> • Address: <b>Spectrum Demo Location</b> ✓", "ai");
                                                    setTimeout(function() {
                                                        renderPickupCard(res.pickup);
                                                        setTimeout(function() {
                                                            addMessage("Your request has been sent to municipal operations.<br><br>" +
                                                                "<b>YOUR REQUESTS SUMMARY</b><br>" +
                                                                "• Complaint: <span class=\"card-id\">" + escapeHtml(res.complaint.id) + "</span> (Garbage on Road) <b>" + escapeHtml(res.complaint.status) + "</b><br>" +
                                                                "• Pickup: <span class=\"card-id\">" + escapeHtml(res.pickup.id) + "</span> (E-Waste) <b>" + escapeHtml(res.pickup.status) + "</b><br><br>" +
                                                                "<i>Municipal team can now process these requests in /demoadmin/.</i>", "ai");
                                                            showTrackingButtons();
                                                        }, 1200);
                                                    }, 1000);
                                                }, 1200);
                                            }, 1000);
                                        }, 1000);
                                    }, 1000);
                                }, 1000);
                            }, 1200);
                        });
                    }, 1200);
                });
            }, 1000);
        }

        function renderRegistrationCardSimulation(onComplete) {
            var card = document.createElement("div");
            card.className = "form-sim-card";
            card.innerHTML = '<div class="form-sim-title">CITIZEN ACCOUNT REGISTRATION</div>' +
                '<div class="form-sim-field"><div class="form-sim-label">Full Name</div><div class="form-sim-val" id="f-name"></div></div>' +
                '<div class="form-sim-field"><div class="form-sim-label">Email Address</div><div class="form-sim-val" id="f-email"></div></div>' +
                '<div class="form-sim-field"><div class="form-sim-label">Phone Number</div><div class="form-sim-val" id="f-phone"></div></div>' +
                '<div class="form-sim-field"><div class="form-sim-label">Residential Address</div><div class="form-sim-val" id="f-addr"></div></div>' +
                '<div class="form-sim-field"><div class="form-sim-label">Password</div><div class="form-sim-val" id="f-pass"></div></div>';
            chatWindow.appendChild(card);
            scrollDown();

            typeText("f-name", "Rahul Sharma", 50, function() {
                typeText("f-email", "citizen@cleanloop.com", 40, function() {
                    typeText("f-phone", "+91 9876543210", 40, function() {
                        typeText("f-addr", "Spectrum Demo Location, Sector 18", 35, function() {
                            typeText("f-pass", "••••••••", 80, function() {
                                if (onComplete) onComplete();
                            });
                        });
                    });
                });
            });
        }

        function typeText(elementId, text, speed, cb) {
            var el = document.getElementById(elementId);
            if (!el) { if (cb) cb(); return; }
            var idx = 0;
            var t = setInterval(function() {
                el.textContent += text.charAt(idx);
                idx++;
                if (idx >= text.length) {
                    clearInterval(t);
                    if (cb) cb();
                }
            }, speed);
        }

        function executeCitizenBackendStart(cb) {
            fetch("/api/demo/citizen-start/", {
                method: "POST",
                credentials: "same-origin",
                headers: { "X-CSRFToken": getCookie("csrftoken") }
            })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (cb) cb(res);
            });
        }

        function renderComplaintCard(c) {
            var card = document.createElement("div");
            card.className = "card";
            card.innerHTML = '<div class="card-head">' +
                '<span class="card-id">' + escapeHtml(c.id) + '</span>' +
                '<span class="' + badgeClass(c.status) + '">' + escapeHtml(c.status) + '</span>' +
                '</div>' +
                '<div class="card-title">' + escapeHtml(c.issue) + '</div>' +
                '<div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">📍 ' + escapeHtml(c.location) + ' • Priority: ' + escapeHtml(c.priority) + '</div>';
            chatWindow.appendChild(card);
            scrollDown();
        }

        function renderPickupCard(p) {
            var pcard = document.createElement("div");
            pcard.className = "card";
            pcard.innerHTML = '<div class="card-head">' +
                '<span class="card-id">' + escapeHtml(p.id) + '</span>' +
                '<span class="' + badgeClass(p.status) + '">' + escapeHtml(p.status) + '</span>' +
                '</div>' +
                '<div class="card-title">' + escapeHtml(p.category) + ' (' + escapeHtml(p.quantity) + ')</div>' +
                '<div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">📍 ' + escapeHtml(p.address) + '</div>';
            chatWindow.appendChild(pcard);
            scrollDown();
        }

        function handleAction(text) {
            addMessage(escapeHtml(text), "user");

            if (text.indexOf("Track Complaint") !== -1) {
                trackComplaint();
                return;
            }
            if (text.indexOf("Track Pickup") !== -1) {
                trackPickup();
                return;
            }

            addMessage("Processing query: " + escapeHtml(text), "ai");
            showTrackingButtons();
        }

        function trackComplaint() {
            fetchSync(function(res) {
                if (!res.ok || !res.complaints || !res.complaints.length) {
                    addMessage("No complaints found.", "ai");
                    showTrackingButtons();
                    return;
                }

                addMessage("📍 <b>Complaint Tracking Query — SQLite Database</b>", "ai");
                res.complaints.forEach(function(c) {
                    var card = document.createElement("div");
                    card.className = "card";
                    var html = '<div class="card-head">' +
                        '<span class="card-id">' + escapeHtml(c.id) + '</span>' +
                        '<span class="' + badgeClass(c.status) + '">' + escapeHtml(c.status) + '</span>' +
                        '</div>' +
                        '<div class="card-title">' + escapeHtml(c.issue) + '</div>' +
                        '<div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">📅 ' + escapeHtml(c.date) + ' • 📍 ' + escapeHtml(c.location) + '</div>' +
                        '<div class="stepper">' +
                        (c.status_steps || []).map(function(s, i) {
                            return '<div class="step ' + (i < c.status_step ? 'done' : (i === c.status_step ? 'current' : '')) + '">' + s + '</div>';
                        }).join('') +
                        '</div>';

                    if (c.timeline && c.timeline.length) {
                        html += '<div class="timeline-list"><b>Audit Timeline Steps:</b>';
                        c.timeline.forEach(function(t) {
                            html += '<div class="timeline-item">• <b>' + escapeHtml(t.status) + ':</b> ' + escapeHtml(t.note) + '</div>';
                        });
                        html += '</div>';
                    }

                    card.innerHTML = html;
                    chatWindow.appendChild(card);
                });
                scrollDown();
                showTrackingButtons();
            });
        }

        function trackPickup() {
            fetchSync(function(res) {
                if (!res.ok || !res.pickups || !res.pickups.length) {
                    addMessage("No pickups found.", "ai");
                    showTrackingButtons();
                    return;
                }

                addMessage("📦 <b>Pickup Request Tracking Query — SQLite Database</b>", "ai");
                res.pickups.forEach(function(p) {
                    var card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = '<div class="card-head">' +
                        '<span class="card-id">' + escapeHtml(p.id) + '</span>' +
                        '<span class="' + badgeClass(p.status) + '">' + escapeHtml(p.status) + '</span>' +
                        '</div>' +
                        '<div class="card-title">' + escapeHtml(p.category) + ' (' + escapeHtml(p.quantity) + ')</div>' +
                        '<div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">📅 ' + escapeHtml(p.date) + ' • 📍 ' + escapeHtml(p.address) + '</div>' +
                        '<div class="stepper">' +
                        (p.status_steps || []).map(function(s, i) {
                            return '<div class="step ' + (i < p.status_step ? 'done' : (i === p.status_step ? 'current' : '')) + '">' + s + '</div>';
                        }).join('') +
                        '</div>';
                    chatWindow.appendChild(card);
                });
                scrollDown();
                showTrackingButtons();
            });
        }

        composer.addEventListener("submit", function (e) {
            e.preventDefault();
            var text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = "";
            clearOldActions();
            handleAction(text);
        });

        boot();
    })();
    </script>
</body>
</html>
