{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Municipal Control AI Assistant | Presentation Demo</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/cleanloop-mark.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-dark: #1e3a8a;
            --accent: #0284c7;
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --border-soft: #e2e8f0;
            --ok: #059669;
            --ok-bg: #d1fae5;
            --warn: #d97706;
            --warn-bg: #fef3c7;
            --err: #dc2626;
            --err-bg: #fee2e2;
            --radius: 14px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .ai-app {
            width: 100%;
            max-width: 960px;
            height: 96vh;
            max-height: 900px;
            background: var(--bg-body);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Header */
        .ai-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            border-bottom: 1px solid #334155;
            position: relative;
            z-index: 10;
        }
        .ai-brand-logo { border-radius: 10px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .ai-title-block { flex: 1; min-width: 0; }
        .ai-title { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
        .ai-subtitle { font-size: 0.76rem; color: #94a3b8; font-weight: 500; }
        .demo-badge {
            background: #2563eb; color: #fff; font-size: 0.72rem; font-weight: 800;
            padding: 4px 10px; border-radius: 999px; letter-spacing: 0.08em;
        }

        /* Chat window */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .msg { max-width: 86%; padding: 12px 16px; border-radius: var(--radius); font-size: 0.94rem; box-shadow: var(--shadow-sm); word-wrap: break-word; line-height: 1.5; }
        .msg.ai {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-bottom-left-radius: 4px;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.ai b { color: #1e3a8a; }
        .msg-time { display: block; font-size: 0.66rem; opacity: 0.55; margin-top: 5px; }

        .timer-box {
            align-self: flex-start;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form sim card */
        .form-sim-card {
            align-self: stretch;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: var(--radius);
            padding: 14px 16px;
            margin: 4px 0;
            box-shadow: var(--shadow-sm);
        }
        .form-sim-title { font-size: 0.88rem; font-weight: 800; color: #0f172a; margin-bottom: 10px; text-transform: uppercase; }
        .form-sim-field { margin-bottom: 8px; }
        .form-sim-label { font-size: 0.72rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .form-sim-val { font-size: 0.9rem; font-weight: 600; color: #0f172a; background: #fff; padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; min-height: 32px; }

        /* Cards */
        .card {
            align-self: stretch;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 14px 16px;
            font-size: 0.9rem;
        }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .card-title { font-weight: 700; font-size: 0.98rem; color: #0f172a; }
        .card-id {
            font-family: monospace; font-size: 0.82rem; font-weight: 800;
            color: var(--primary-dark); background: var(--primary-light);
            padding: 3px 8px; border-radius: 6px;
        }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
        .badge-pending, .badge-requested { background: var(--warn-bg); color: var(--warn); }
        .badge-inprogress, .badge-assigned { background: #dbeafe; color: #1e40af; }
        .badge-resolved, .badge-completed { background: var(--ok-bg); color: var(--ok); }

        .timeline-list { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-soft); font-size: 0.82rem; }
        .timeline-item { margin-bottom: 6px; color: var(--text-main); }
        .timeline-item b { color: var(--primary-dark); }

        /* Composer */
        .composer {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid var(--border-soft);
            background: var(--surface);
        }
        #chat-input {
            flex: 1; padding: 12px 18px; border: 1.5px solid var(--border);
            border-radius: 999px; font-size: 0.95rem; outline: none;
            background: var(--bg-body); transition: border-color 0.15s;
        }
        #chat-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.12); }
        .send-btn {
            width: 46px; height: 46px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(30, 64, 175, 0.35); transition: transform 0.12s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn svg { width: 20px; height: 20px; }

        @media (max-width: 640px) {
            body { padding: 0; }
            .ai-app { border-radius: 0; max-height: 100vh; }
            .msg { max-width: 92%; }
        }
    </style>
</head>
<body>
    <div class="ai-app">
        <!-- Header -->
        <header class="ai-header">
            <img class="ai-brand-logo" src="{% static 'images/cleanloop-mark.svg' %}" alt="CleanLoop logo" width="38" height="38">
            <div class="ai-title-block">
                <div class="ai-title">CleanLoop Control AI</div>
                <div class="ai-subtitle">Municipal Dispatch & Operations Assistant</div>
            </div>
            <span class="demo-badge">ADMIN DEMO</span>
        </header>

        <!-- Chat window -->
        <main id="chat-window" aria-live="polite"></main>

        <!-- Composer -->
        <form class="composer" id="composer" autocomplete="off">
            <input type="text" id="chat-input" placeholder="Type a command…" autocomplete="off">
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send command">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script>
    (function () {
        "use strict";

        var chatWindow = document.getElementById("chat-window");
        var inputEl = document.getElementById("chat-input");
        var sendBtn = document.getElementById("send-btn");
        var composer = document.getElementById("composer");
        var timerBoxEl = null;

        function getCookie(name) {
            var m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
            return m ? m.pop() : "";
        }

        function nowTime() {
            var d = new Date();
            return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
        }

        function scrollDown() {
            requestAnimationFrame(function () { chatWindow.scrollTop = chatWindow.scrollHeight; });
        }

        function addMessage(html, who) {
            var div = document.createElement("div");
            div.className = "msg " + who;
            div.innerHTML = html;
            var t = document.createElement("span");
            t.className = "msg-time";
            t.textContent = nowTime();
            div.appendChild(t);
            chatWindow.appendChild(div);
            scrollDown();
            return div;
        }

        function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text || "";
            return d.innerHTML;
        }

        function badgeClass(st) {
            return "badge badge-" + (st || "").toLowerCase().replace(/\s+/g, "");
        }

        function boot() {
            addMessage("Municipal Control AI<br>Connecting to operations console…", "ai");
            start5SecTimer();
        }

        function start5SecTimer() {
            var remaining = 5;
            timerBoxEl = document.createElement("div");
            timerBoxEl.className = "timer-box";
            timerBoxEl.innerHTML = '⏱️ Authenticating municipal administrator session in <b><span id="ad-cd">' + remaining + '</span>s</b>…';
            chatWindow.appendChild(timerBoxEl);
            scrollDown();

            var timer = setInterval(function() {
                remaining--;
                var el = document.getElementById("ad-cd");
                if (el) el.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(timer);
                    if (timerBoxEl) timerBoxEl.remove();
                    runAdminAutoLoginAndProcessing();
                }
            }, 1000);
        }

        function runAdminAutoLoginAndProcessing() {
            renderAdminLoginSimulation(function() {
                addMessage("Authenticating admin session with Django backend…", "ai");
                fetch("/api/demo/auto-login/?role=admin", { method: "GET", credentials: "same-origin" })
                .then(function(r) { return r.json(); })
                .then(function() {
                    addMessage("CleanLoop Control AI Active 🛡️<br>Welcome back, Officer Municipal.<br><br><b>LIVE CITIZEN REQUEST QUEUE</b>", "ai");
                    loadAndProcessDemoState();
                });
            });
        }

        function renderAdminLoginSimulation(cb) {
            var card = document.createElement("div");
            card.className = "form-sim-card";
            card.innerHTML = '<div class="form-sim-title">MUNICIPAL OFFICER AUTHENTICATION</div>' +
                '<div class="form-sim-field"><div class="form-sim-label">Admin ID / Email</div><div class="form-sim-val" id="ad-email"></div></div>' +
                '<div class="form-sim-field"><div class="form-sim-label">Password</div><div class="form-sim-val" id="ad-pass"></div></div>';
            chatWindow.appendChild(card);
            scrollDown();

            typeText("ad-email", "admin@gmail.com", 45, function() {
                typeText("ad-pass", "••••••••", 70, function() {
                    if (cb) cb();
                });
            });
        }

        function typeText(elementId, text, speed, cb) {
            var el = document.getElementById(elementId);
            if (!el) { if (cb) cb(); return; }
            var idx = 0;
            var t = setInterval(function() {
                el.textContent += text.charAt(idx);
                idx++;
                if (idx >= text.length) {
                    clearInterval(t);
                    if (cb) cb();
                }
            }, speed);
        }

        function loadAndProcessDemoState() {
            fetch("/api/demo/citizen-sync/", { method: "GET", credentials: "same-origin" })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (!res.ok) return;

                var c = res.complaints && res.complaints[0];
                var p = res.pickups && res.pickups[0];

                if (c) {
                    var card = document.createElement("div");
                    card.className = "card";
                    card.id = "c-card";
                    card.innerHTML = '<div class="card-head">' +
                        '<span class="card-id">' + escapeHtml(c.id) + '</span>' +
                        '<span class="' + badgeClass(c.status) + '" id="c-badge">' + escapeHtml(c.status) + '</span>' +
                        '</div>' +
                        '<div class="card-title">' + escapeHtml(c.issue) + '</div>' +
                        '<div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">📍 ' + escapeHtml(c.location) + ' • Priority: ' + escapeHtml(c.priority) + '</div>';
                    chatWindow.appendChild(card);
                }

                if (p) {
                    var pcard = document.createElement("div");
                    pcard.className = "card";
                    pcard.id = "p-card";
                    pcard.innerHTML = '<div class="card-head">' +
                        '<span class="card-id">' + escapeHtml(p.id) + '</span>' +
                        '<span class="' + badgeClass(p.status) + '" id="p-badge">' + escapeHtml(p.status) + '</span>' +
                        '</div>' +
                        '<div class="card-title">' + escapeHtml(p.category) + ' (' + escapeHtml(p.quantity) + ')</div>' +
                        '<div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">📍 ' + escapeHtml(p.address) + '</div>';
                    chatWindow.appendChild(pcard);
                }
                scrollDown();

                // Automated processing after a short pause
                setTimeout(function() {
                    addMessage("Reviewing complaint… Assigning Rapid Response Crew #4… Updating status…", "ai");
                    setTimeout(function() {
                        fetch("/api/demo/admin-process/", {
                            method: "POST",
                            credentials: "same-origin",
                            headers: { "X-CSRFToken": getCookie("csrftoken") }
                        })
                        .then(function(r) { return r.json(); })
                        .then(function(resData) {
                            if (!resData.ok) return;

                            var compRes = resData.complaint;
                            var pickRes = resData.pickup;

                            var bgC = document.getElementById("c-badge");
                            if (bgC) { bgC.className = "badge badge-resolved"; bgC.textContent = "Resolved"; }

                            var bgP = document.getElementById("p-badge");
                            if (bgP) { bgP.className = "badge badge-completed"; bgP.textContent = "Completed"; }

                            addMessage("Reviewing pickup request… Assigning EV Eco-Van #12… Doorstep collection completed.", "ai");

                            setTimeout(function() {
                                addMessage("MUNICIPAL ACTION COMPLETE ✅<br><br>" +
                                    "• Complaint <span class=\"card-id\">" + escapeHtml(compRes.id) + "</span> → <span class=\"badge badge-resolved\">" + escapeHtml(compRes.status) + "</span><br>" +
                                    "• Pickup <span class=\"card-id\">" + escapeHtml(pickRes.id) + "</span> → <span class=\"badge badge-completed\">" + escapeHtml(pickRes.status) + "</span><br><br>" +
                                    "<i>Citizen can now track the updated status. Return to /democitizenai/ to verify.</i>", "ai");
                            }, 1200);
                        });
                    }, 1500);
                }, 1500);
            });
        }

        composer.addEventListener("submit", function (e) {
            e.preventDefault();
            var text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = "";
            addMessage(escapeHtml(text), "user");
            addMessage("Command received: " + escapeHtml(text), "ai");
        });

        boot();
    })();
    </script>
</body>
</html>
